# Multi-Target Application: what is deployed to SAP BTP Cloud Foundry, and how the parts connect.
#
#   Browser -> sprint (approuter: SAP login via XSUAA) -> sprint-srv (CAP backend + UI files) -> HANA (RETS)
#
# Build: mbt build      Deploy: cf deploy mta_archives/sprint_1.0.0.mtar
_schema-version: "3.3.0"
ID: sprint
version: 1.0.0
description: "Rental Equipment Tracking & Condition Logging (SAP CAP + Fiori)"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci                          # install backend dependencies
        - npx cds build --production      # compile CDS into gen/srv (backend) and gen/db (HANA artifacts)
        - node scripts/copy-ui.js         # ship the UI (app/) with the backend; CAP serves it as static files

modules:
  # CAP backend: OData services, business logic, and the UI (index.html, launchpad, Fiori apps)
  - name: sprint-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sprint-auth             # XSUAA: validates the user's login token and roles
      - name: RETS                    # HANA database (HDI container)
      - name: sprint-destination

  # Creates / updates the database tables and views in HANA, then stops
  - name: sprint-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: RETS

  # Approuter: the public URL. Sends users through the SAP login and forwards requests to the backend.
  - name: sprint
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true      # pass the user's login token on to the backend
      - name: sprint-auth
      - name: sprint-destination

resources:
  # Login and roles (role templates in xs-security.json)
  - name: sprint-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sprint-${org}-${space}
        tenant-mode: dedicated

  # HANA HDI container holding the application's tables
  - name: RETS
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: sprint-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
