<!DOCTYPE html>
<!--
  Single entry page of the UI.
    /index.html            -> the launchpad (app/launchpad/main.js)
    /index.html?app=<id>   -> one of the 8 Fiori Elements apps (e.g. ?app=rentals), with our shell bar on top
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Equipment Tracking</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <script src="/shared/config.js"></script>          <!-- app catalogue + role permissions -->
    <script src="/shared/session.js"></script>         <!-- signed-in SAP user, CSRF-safe requests -->
    <script src="/shared/app-shell.js"></script>       <!-- shell bar + access check around each app -->
    <script src="/shared/photo-evidence.js"></script>  <!-- photo upload dialog -->
    <script>
        // Decide what to show, then load SAP UI5 (SAPUI5 CDN, Horizon theme following the OS light/dark setting)
        const appId = new URLSearchParams(location.search).get('app');
        const app = window.RETCL.apps[appId];                                 // undefined = launchpad
        const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'sap_horizon_dark' : 'sap_horizon';
        const ui5 = app
            ? { roots: { [app.ns]: `/${appId}/webapp` }, onInit: 'module:sap/ui/core/ComponentSupport', libs: '' }   // a Fiori app
            : { roots: { 'retcl.launchpad': './launchpad' }, onInit: 'module:retcl/launchpad/main',
                libs: 'sap.m,sap.f,sap.ui.layout,sap.suite.ui.microchart' };                                         // the launchpad
        if (app) document.title = app.fullTitle;
        document.write(`<script id="sap-ui-bootstrap" src="https://ui5.sap.com/resources/sap-ui-core.js"
            data-sap-ui-theme="${theme}" ${ui5.libs && `data-sap-ui-libs="${ui5.libs}"`}
            data-sap-ui-resourceroots='${JSON.stringify(ui5.roots)}' data-sap-ui-on-init="${ui5.onInit}"
            data-sap-ui-compat-version="edge" data-sap-ui-async="true" data-sap-ui-frame-options="trusted"><\/script>`);
    </script>
</head>
<body class="sapUiBody">
    <script>
        if (app) {
            // Fiori app: placeholder that UI5's ComponentSupport turns into the app, plus our shell around it.
            // data-height="100%" is required: without it the app gets height 0 and the page looks empty.
            document.body.classList.add('retclAppMode', 'sapUiSizeCompact');
            document.write(`<div data-sap-ui-component data-name="${app.ns}" data-id="container" data-height="100%" data-width="100%" data-settings='{"id":"${app.ns}"}'></div>`);
            startAppShell(appId);
        }
    </script>
    <div id="launchpad-root"><div class="retclBoot">Loading launchpad&hellip;</div></div>
</body>
</html>
