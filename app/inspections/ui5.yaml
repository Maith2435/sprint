specVersion: "3.1"

metadata:
  name: inspections

type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: inspections
        relativePaths: true
        additionalFiles:
          - xs-app.json
